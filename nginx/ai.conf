server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.agl.local;

    ssl_certificate     /etc/nginx/certs/ai.crt;   # сертификат от внутреннего ЦС (с цепочкой)
    ssl_certificate_key /etc/nginx/certs/ai.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 200m;      # загрузка файлов в чат

    # перевод документов (doc-translate): вход по сессии LibreChat, большие файлы и долгий перевод
    location /translate/ {
        proxy_pass http://doc-translate:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }

    # стенд агентов: файлы, которые агент сделал для сотрудника (вход по сессии LibreChat).
    # Адрес — через переменную: nginx стартует и без запущенного стенда
    location /agent-files/ {
        resolver 127.0.0.11 valid=30s;
        set $agents_router http://agents-router:8080;
        proxy_pass $agents_router;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://LibreChat:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;       # ответы модели идут потоком
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
