# Шлюз маскирования + публикация: presidio-ru, ocr-ru, doc-translate, litellm (с обработчиком pii_guard.py), nginx.
# LibreChat ставится отдельно (/opt/librechat) и подключается к той же сети ai-net.
# Порты наружу публикует только nginx (443/80). Остальные сервисы доступны лишь внутри ai-net.

services:
  presidio-analyzer:
    build: ./presidio-ru
    image: avtom1cgl/presidio-ru:1.0
    restart: unless-stopped
    environment:
      MASK_ENTITIES: ${MASK_ENTITIES:-PERSON,RU_INN_PERSON,RU_SNILS,RU_PASSPORT,PHONE_NUMBER,EMAIL_ADDRESS,RU_BANK_ACCOUNT,CREDIT_CARD,CN_ID_CARD}
      LOG_LEVEL: INFO
    networks: [ai-net]

  # распознавание сканов, фото, чеков (рус/англ/кит) для LibreChat — без внешних сервисов
  ocr-ru:
    build: ./ocr-ru
    image: avtom1cgl/ocr-ru:1.0
    restart: unless-stopped
    environment:
      OCR_API_KEY: ${OCR_API_KEY}
    mem_limit: 2g
    networks: [ai-net]

  # перевод документов с сохранением вёрстки: https://ai.<домен>/translate/ (вход — сессия LibreChat)
  doc-translate:
    build: ./doc-translate
    image: avtom1cgl/doc-translate:1.0
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OCR_API_KEY: ${OCR_API_KEY}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET}   # тот же, что в /opt/librechat/.env — проверка входа
      INTERNAL_KEY: ${DOC_INTERNAL_KEY}                     # вход для инструмента агента (doc-translate-mcp)
      LLM_MODEL: qwen-fast
    volumes:
      - ../librechat/uploads:/uploads:ro                    # файлы, прикреплённые в чате, — только чтение
    mem_limit: 3g
    depends_on: [litellm, ocr-ru]
    networks: [ai-net]

  # инструмент агента «перевести прикреплённый файл с вёрсткой» (MCP); сам перевод — в doc-translate
  doc-translate-mcp:
    image: avtom1cgl/doc-translate:1.0
    restart: unless-stopped
    command: ["uvicorn", "mcp_server:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DOC_MCP_KEY: ${DOC_MCP_KEY}                           # тот же — в /opt/librechat/.env
      INTERNAL_KEY: ${DOC_INTERNAL_KEY}
      WEB_BASE: http://doc-translate:8000
    mem_limit: 256m
    depends_on: [doc-translate]
    networks: [ai-net]

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.1  # = main-stable на 21.10.2026; при обновлении перепроверить маскирование (smoke-test)
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/pii_guard.py:/app/pii_guard.py:ro   # обработчик маскирования (подключён в config.yaml)
      # если удалённый LiteLLM на сертификате внутреннего ЦС — раскомментировать:
      # - ./certs/internal-ca.crt:/usr/local/share/ca-certificates/internal-ca.crt:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      REMOTE_LITELLM_BASE: ${REMOTE_LITELLM_BASE}
      REMOTE_LITELLM_KEY: ${REMOTE_LITELLM_KEY}
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      # SSL_CERT_FILE: /usr/local/share/ca-certificates/internal-ca.crt
    depends_on: [presidio-analyzer]
    networks: [ai-net]

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["443:443", "80:80"]
    volumes:
      - ./nginx/ai.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [ai-net]

networks:
  ai-net:
    external: true
